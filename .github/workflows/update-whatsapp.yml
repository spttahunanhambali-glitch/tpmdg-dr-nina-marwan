name: Update WhatsApp number

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace WhatsApp number and clean up
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '6282371123042'
          new = '6281222886446'
          s2 = s.replace(old, new)
          if s2 == s:
              raise SystemExit('Old WhatsApp number not found')
          p.write_text(s2, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/update-whatsapp.yml
          git commit -m 'Update WhatsApp contact number'
          git push

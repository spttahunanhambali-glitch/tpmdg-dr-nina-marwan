name: Apply luxury 3D visual effects

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 3D visual layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '/* LUXURY_3D_LAYER */' in s:
              raise SystemExit('3D layer already installed')

          css = r'''
          /* LUXURY_3D_LAYER */
          :root{--goldGlow:rgba(237,211,155,.42);--depth:rgba(0,0,0,.28)}
          .hero:before{content:"";position:absolute;width:420px;height:420px;right:-110px;top:-150px;border:1px solid rgba(229,202,144,.12);border-radius:50%;box-shadow:0 0 100px rgba(201,164,92,.09),inset 0 0 80px rgba(201,164,92,.04);transform:rotate(-12deg);pointer-events:none}
          .heroGrid>div:first-child{position:relative;z-index:1}
          .heroGrid>div:first-child:after{content:"";position:absolute;left:-34px;top:12%;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(237,211,155,.12),transparent 68%);filter:blur(8px);pointer-events:none;z-index:-1}
          .media,.panel,.card,.bookPanel,.bookBox,.feature,.cat,.article,.int,.contact,.ctaBox{transform-style:preserve-3d;backface-visibility:hidden}
          .media{box-shadow:0 38px 90px rgba(0,0,0,.48),0 8px 0 rgba(201,164,92,.05);transition:box-shadow .35s ease,transform .25s ease}
          .media:before{content:"";position:absolute;inset:7px;border:1px solid rgba(237,211,155,.13);border-radius:27px;pointer-events:none;transform:translateZ(9px)}
          .media:after{content:"";position:absolute;inset:10% 15% auto 15%;height:35%;background:radial-gradient(circle,rgba(237,211,155,.18),transparent 68%);filter:blur(22px);pointer-events:none;transform:translateZ(-8px)}
          .media img{transform:translateZ(18px);box-shadow:0 22px 40px rgba(0,0,0,.24)}
          .label{transform:translateZ(42px);box-shadow:0 16px 30px rgba(0,0,0,.28),inset 0 0 30px rgba(237,211,155,.035)}
          .seal{transform:translateZ(52px);box-shadow:0 8px 24px rgba(201,164,92,.18),inset 0 0 18px rgba(237,211,155,.08)}
          .panel,.bookPanel,.feature{box-shadow:0 28px 70px rgba(0,0,0,.2),0 2px 0 rgba(237,211,155,.12) inset}
          .card,.cat,.article,.int,.contact,.bookBox,.ctaBox{box-shadow:0 18px 40px rgba(51,39,20,.09),0 1px 0 rgba(255,255,255,.72) inset}
          .card:before,.cat:before,.article:before,.int:before,.contact:before,.bookBox:before,.ctaBox:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transform:translateZ(1px)}
          .card,.cat,.article,.int,.contact,.bookBox,.ctaBox,.panel,.bookPanel,.feature{position:relative;transition:transform .25s ease,box-shadow .3s ease}
          .card:hover,.cat:hover,.article:hover,.int:hover,.contact:hover,.bookBox:hover,.ctaBox:hover{box-shadow:0 26px 54px rgba(51,39,20,.15),0 1px 0 rgba(255,255,255,.85) inset}
          .icon,.catIcon,.mini,.sig{transform:translateZ(18px);box-shadow:0 10px 22px rgba(88,61,24,.11),inset 0 1px 0 rgba(255,255,255,.45)}
          .btn-g{box-shadow:0 14px 30px rgba(0,0,0,.22),0 1px 0 rgba(255,255,255,.45) inset,0 0 22px rgba(237,211,155,.08)}
          .btn-g:hover{box-shadow:0 18px 38px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.5) inset,0 0 30px rgba(237,211,155,.16)}
          .chip{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 16px rgba(0,0,0,.12)}
          .float-wa{box-shadow:0 16px 38px rgba(0,0,0,.3),0 0 24px rgba(237,211,155,.18);transition:transform .25s ease,box-shadow .25s ease}
          .float-wa:hover{transform:translateY(-5px) scale(1.05);box-shadow:0 20px 44px rgba(0,0,0,.34),0 0 34px rgba(237,211,155,.25)}
          @media(prefers-reduced-motion:reduce){.media,.panel,.card,.bookPanel,.bookBox,.feature,.cat,.article,.int,.contact,.ctaBox{transition:none!important;transform:none!important}.media:before,.media:after{display:none}}
          @media(max-width:620px){.hero:before{width:260px;height:260px;right:-120px;top:-80px}.label{transform:translateZ(22px)}.media img{transform:translateZ(10px)}}
          '''

          js = r'''
          /* LUXURY_3D_INTERACTION */
          (function(){
            const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if(reduce || !window.matchMedia('(pointer:fine)').matches) return;
            const targets=[...document.querySelectorAll('.media,.card,.bookPanel,.bookBox,.feature,.cat,.article,.int,.contact,.ctaBox')];
            targets.forEach(el=>{
              el.addEventListener('pointermove',e=>{
                const r=el.getBoundingClientRect();
                const x=(e.clientX-r.left)/r.width-.5;
                const y=(e.clientY-r.top)/r.height-.5;
                const amount=el.classList.contains('media')?5:3.5;
                el.style.transform=`perspective(1100px) rotateX(${(-y*amount).toFixed(2)}deg) rotateY(${(x*amount).toFixed(2)}deg) translateZ(5px)`;
              });
              el.addEventListener('pointerleave',()=>{el.style.transform='';});
            });
          })();
          '''

          s=s.replace('</style>', css+'\n  </style>', 1)
          s=s.replace("    })();\n  </script>", "    })();\n\n    (function(){\n      const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n      if(reduce || !window.matchMedia('(pointer:fine)').matches)return;\n      const targets=[...document.querySelectorAll('.media,.card,.bookPanel,.bookBox,.feature,.cat,.article,.int,.contact,.ctaBox')];\n      targets.forEach(el=>{\n        el.addEventListener('pointermove',e=>{\n          const r=el.getBoundingClientRect();\n          const x=(e.clientX-r.left)/r.width-.5;\n          const y=(e.clientY-r.top)/r.height-.5;\n          const amount=el.classList.contains('media')?5:3.5;\n          el.style.transform=`perspective(1100px) rotateX(${(-y*amount).toFixed(2)}deg) rotateY(${(x*amount).toFixed(2)}deg) translateZ(5px)`;\n        });\n        el.addEventListener('pointerleave',()=>{el.style.transform='';});\n      });\n    })();\n  </script>",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add luxury 3D visual effects'
          git push

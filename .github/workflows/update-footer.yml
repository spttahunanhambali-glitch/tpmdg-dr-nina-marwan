name: Update footer text
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-footer.yml'
      - 'index.html'

permissions:
  contents: write

jobs:
  update-footer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace footer credit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Dimiliki oleh drg. Nina Nurliah · Kota Jambi'
          new = 'Power By Akbar Fadhilah'
          if old not in s:
              raise SystemExit('Footer text not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update footer credit to Power By Akbar Fadhilah'
          git push

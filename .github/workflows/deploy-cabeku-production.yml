name: Cabeku Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cabeku/**'
      - 'functions/api/growth-engine.ts'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-cabeku-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Deploy Cabeku Production

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cabeku/**'
      - 'functions/api/growth-engine.ts'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-cabeku-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cabeku-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

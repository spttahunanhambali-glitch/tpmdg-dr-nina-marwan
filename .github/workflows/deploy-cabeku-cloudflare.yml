name: Deploy Cabeku Production

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cabeku/**'
      - 'serba-serbi/cabeku/**'
      - 'functions/api/cabeku-scan.ts'
      - 'functions/api/cabeku-health.ts'
      - 'functions/api/growth-engine.ts'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-cabeku-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cabeku-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Cloudflare API token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          status="$(printf '%s' "$response" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s); console.log(j?.result?.status ?? "unknown")})')"
          echo "Cloudflare token status: ${status}"
          test "${status}" = "active"

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

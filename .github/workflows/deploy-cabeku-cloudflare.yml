name: Deploy Cabeku Production

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cabeku/**'
      - 'serba-serbi/cabeku/**'
      - 'functions/api/cabeku-scan.ts'
      - 'functions/api/cabeku-health.ts'
      - 'functions/api/growth-engine.ts'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-cabeku-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cabeku-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Cloudflare API token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          HTTP_CODE="$http_code" RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require('fs');
          const body = fs.readFileSync(process.env.RESPONSE_FILE, 'utf8');
          let json;
          try {
            json = JSON.parse(body);
          } catch {
            console.error(`Cloudflare token verification returned HTTP ${process.env.HTTP_CODE} with non-JSON response.`);
            process.exit(1);
          }

          console.log(`Cloudflare token verify HTTP: ${process.env.HTTP_CODE}`);
          console.log(`Cloudflare token verify success: ${json?.success === true}`);
          console.log(`Cloudflare token status: ${json?.result?.status ?? 'unknown'}`);

          const error = Array.isArray(json?.errors) ? json.errors[0] : null;
          if (error) {
            console.error(`Cloudflare API error ${error.code ?? 'unknown'}: ${error.message ?? 'unknown error'}`);
          }

          if (json?.success !== true || json?.result?.status !== 'active') {
            process.exit(1);
          }
          NODE
          rm -f "$response_file"

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

name: Fix WhatsApp number everywhere

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace every old WhatsApp reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '6282371123042': '6281222886446',
              '+62 823 7112 3042': '+62 812 2288 6446',
          }
          original = s
          for old, new in replacements.items():
              s = s.replace(old, new)
          if s == original:
              raise SystemExit('No old WhatsApp references found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Replace all WhatsApp contact references'
          git push
